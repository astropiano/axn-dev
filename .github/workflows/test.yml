name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsc -b across the workspace — also the typecheck gate.
      - run: pnpm build
      # Root vitest delegates to each package's own config.
      - run: pnpm test
